# Dark base theme so every Streamlit widget (labels, nav, legends, menus)
# is legible on the app's slate background.
[theme]
base = "dark"
primaryColor = "#818cf8"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
font = "sans-serif"

[browser]
gatherUsageStats = false

[client]
# Hide developer-only menu items (Deploy, rerun, settings) from end users
toolbarMode = "minimal"
